name: Build Android AAB (Google Play Store)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode (entero incremental, ej. 1, 2, 3...)'
        required: true
        default: '1'
      version_name:
        description: 'Android versionName (ej. 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-aab:
    runs-on: ubuntu-latest
    environment: VARIABLES DE ENTORNO
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://dowxayyvtghtjkctasfn.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ofEQ4jJ_O8ziwbOemySWiA_stfFYEhE' }}
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Decode Release Keystore (if configured)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/android/upload-keystore.jks"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 no está configurado en Secrets. El .aab se generará sin firma de subida."
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve versionCode & versionName
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VC="${{ github.event.inputs.version_code }}"
            VN="${{ github.event.inputs.version_name }}"
          else
            TAG_NAME="${GITHUB_REF_NAME#v}"
            VC="${{ github.run_number }}"
            VN="$TAG_NAME"
          fi
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "name=$VN" >> "$GITHUB_OUTPUT"

      - name: Build Signed Android App Bundle (.aab) & APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.has_keystore == 'true' && format('{0}/android/upload-keystore.jks', github.workspace) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Cleanup keystore file
        if: always()
        run: rm -f "${{ github.workspace }}/android/upload-keystore.jks"

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: courtvision-stats-v${{ steps.ver.outputs.name }}-build${{ steps.ver.outputs.code }}-aab
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
