name: Sync NBA Stats

on:
  schedule:
    # Runs every 6 hours to keep scores fresh and prevent Supabase free-tier 7-day pause
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Days back to sync'
        required: false
        default: '4'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run NBA sync to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://dowxayyvtghtjkctasfn.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          DAYS_BACK="${{ github.event.inputs.days_back || '4' }}"
          python scripts/sync_nba.py --days-back "$DAYS_BACK" --days-ahead 3
